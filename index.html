<!DOCTYPE html>
<html lang="id">
<head>

    Kopi Pahit — Virtual Gallery BPS Babel

  <!-- =========================================================
       A-FRAME
  ========================================================== -->

       NIPPLE JS
  ========================================================== -->

  <style>

    /* =========================================================
       GLOBAL
    ========================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

      background: #f5f1e8;
    }


    body {
      user-select: none;
      -webkit-user-select: none;
    }


    /* =========================================================
       LOADING
    ========================================================== */

    #loading {

      position: fixed;
      inset: 0;

      z-index: 9999;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      background:
        linear-gradient(
          145deg,
          #f9f7f1,
          #eef3f0
        );

      color: #24455c;
    }


    #loading-logo {

      width: 130px;

      margin-bottom: 20px;
    }


    #loading-title {

      font-size: 20px;

      font-weight: 900;

      letter-spacing: 2px;
    }


    #loading-sub {

      margin-top: 8px;

      color: #7b8792;

      font-size: 12px;
    }


    /* =========================================================
       DESKTOP / MOBILE HUD
    ========================================================== */

    #hud {

      position: fixed;

      top: 18px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 1000;

      padding: 9px 18px;

      border-radius: 50px;

      background:
        rgba(255,255,255,0.88);

      border:
        1px solid rgba(0,142,204,0.20);

      box-shadow:
        0 8px 25px rgba(0,0,0,0.08);

      color: #174e6d;

      font-size: 11px;

      font-weight: 800;

      white-space: nowrap;
    }


    #back-btn {

      position: fixed;

      top: 18px;

      left: 18px;

      z-index: 1000;

      display: none;

      border: none;

      padding: 10px 15px;

      border-radius: 12px;

      background: rgba(255,255,255,0.90);

      color: #174e6d;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.08);
    }


    /* =========================================================
       JOYSTICK
    ========================================================== */

    #joystick-zone {

      position: fixed;

      left: 18px;
      bottom: 18px;

      width: 125px;
      height: 125px;

      z-index: 1000;

      touch-action: none;
    }


    /* =========================================================
       YOUTUBE CINEMA OVERLAY
    ========================================================== */

    #youtube-overlay {

      position: fixed;

      inset: 0;

      z-index: 3000;

      display: none;

      align-items: center;
      justify-content: center;

      pointer-events: none;

      background: transparent;
    }


    #youtube-screen {

      width: min(72vw, 900px);

      aspect-ratio: 16 / 9;

      position: relative;

      pointer-events: auto;

      background: #000;

      border-radius: 4px;

      border:
        10px solid #111820;

      box-shadow:
        0 0 0 2px #f28c18,
        0 25px 80px rgba(0,0,0,0.7);
    }


    #youtube-frame {

      width: 100%;
      height: 100%;

      border: none;

      display: block;
    }


    #youtube-title {

      position: absolute;

      left: 50%;
      top: -58px;

      transform: translateX(-50%);

      color: white;

      font-size: 14px;

      font-weight: 900;

      letter-spacing: 2px;

      white-space: nowrap;
    }


    #on-air {

      position: absolute;

      top: 12px;
      right: 12px;

      padding: 6px 10px;

      background: #e53935;

      color: white;

      border-radius: 6px;

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 1px;

      z-index: 4;
    }


    /* =========================================================
       STUDIO CLOSE
    ========================================================== */

    #close-studio {

      position: fixed;

      right: 22px;
      top: 18px;

      z-index: 3200;

      display: none;

      padding: 10px 15px;

      border: none;

      border-radius: 12px;

      cursor: pointer;

      color: white;

      background: #f28c18;

      font-weight: 900;
    }


    /* =========================================================
       MOBILE
    ========================================================== */

    @media(max-width: 700px) {

      #hud {

        font-size: 9px;

        max-width: 78vw;

        white-space: normal;

        text-align: center;
      }


      #youtube-screen {

        width: 88vw;

        border-width: 6px;
      }


      #youtube-title {

        font-size: 10px;

        top: -34px;
      }

    }

  </style>
</head>

      position="4 4 -7">

    ======================================================== -->

    ======================================================== -->

/* ============================================================
   CREATE TEXT
============================================================ */

function textEntity(
  value,
  position,
  color,
  width = 4,
  align = "center"
) {

  const text =
    document.createElement("a-text");

  text.setAttribute(
    "value",
    value
  );

  text.setAttribute(
    "position",
    position
  );

  text.setAttribute(
    "color",
    color
  );

  text.setAttribute(
    "width",
    width
  );

  text.setAttribute(
    "align",
    align
  );

  text.setAttribute(
    "font",
    "roboto"
  );

  return text;
}



/* ============================================================
   BOX
============================================================ */

function boxEntity(
  position,
  width,
  height,
  depth,
  color,
  extra = ""
) {

  const box =
    document.createElement("a-box");

  box.setAttribute(
    "position",
    position
  );

  box.setAttribute(
    "width",
    width
  );

  box.setAttribute(
    "height",
    height
  );

  box.setAttribute(
    "depth",
    depth
  );

  box.setAttribute(
    "color",
    color
  );

  if (extra) {

    box.setAttribute(
      "material",
      extra
    );

  }

  return box;

}

/* ============================================================
   YEAR CARD
============================================================ */

function createYearCard(
  year,
  subtitle,
  position,
  active
) {

  const card =
    document.createElement(
      "a-entity"
    );

  card.setAttribute(
    "position",
    position
  );


  /*
   * PANEL
   */

  const panel =
    boxEntity(
      "0 0 0",
      2.35,
      3.0,
      0.18,
      "#ffffff",
      `
        metalness: 0.05;
        roughness: 0.55;
      `
    );

  card.appendChild(
    panel
  );


  /*
   * TOP BAR
   */

  const color =
    year === 2026
      ? COLORS.blue
      : year === 2027
      ? COLORS.green
      : COLORS.orange;


  card.appendChild(

    boxEntity(
      "0 1.35 0.12",
      2.20,
      0.10,
      0.03,
      color
    )

  );


  /*
   * YEAR
   */

  card.appendChild(

    textEntity(
      String(year),
      "0 0.65 0.13",
      COLORS.navy,
      4
    )

  );


  /*
   * SUBTITLE
   */

  card.appendChild(

    textEntity(
      subtitle,
      "0 -0.05 0.13",
      "#75818a",
      2.7
    )

  );


  /*
   * BUTTON
   */

  const button =
    boxEntity(
      "0 -0.82 0.13",
      1.65,
      0.48,
      0.06,
      active
        ? COLORS.blue
        : "#b6bcc0"
    );


  card.appendChild(
    button
  );


  card.appendChild(

    textEntity(
      active
        ? "MASUK →"
        : "SEGERA HADIR",
      "0 -0.82 0.18",
      "#ffffff",
      1.8
    )

  );


  /*
   * CLICK
   */

  if (active) {

    card.classList.add(
      "clickable"
    );


    card.addEventListener(
      "click",
      () => {

        enterYear(
          year
        );

      }
    );

  }


  yearHall.appendChild(
    card
  );

}



/* ============================================================
   SIMPLE PLANT
============================================================ */

function createPlant(position) {

  const group =
    document.createElement(
      "a-entity"
    );

  group.setAttribute(
    "position",
    position
  );


  group.appendChild(

    boxEntity(
      "0 0.25 0",
      0.7,
      0.5,
      0.7,
      "#ffffff"
    )

  );


  const trunk =
    boxEntity(
      "0 0.75 0",
      0.10,
      1.0,
      0.10,
      COLORS.green
    );

  group.appendChild(
    trunk
  );


  for (
    let i = 0;
    i < 3;
    i++
  ) {

    const leaf =
      document.createElement(
        "a-sphere"
      );

    leaf.setAttribute(
      "radius",
      "0.28"
    );

    leaf.setAttribute(
      "position",
      `${(i-1)*0.25} 1.2 0`
    );

    leaf.setAttribute(
      "scale",
      "1 0.65 1"
    );

    leaf.setAttribute(
      "color",
      COLORS.green
    );

    group.appendChild(
      leaf
    );

  }


  yearHall.appendChild(
    group
  );

}

  backBtn.style.display =

  rig.setAttribute(

/* ============================================================
   YOUTUBE EMBED NORMALIZER
============================================================ */

function getYoutubeEmbed(
  url
) {

  if (!url) {

    return "";

  }


  /*
   * Already embed URL
   */

  if (
    url.includes(
      "youtube.com/embed/"
    )
  ) {

    return (
      url +
      (
        url.includes("?")
          ? "&"
          : "?"
      ) +
      "autoplay=1&rel=0&modestbranding=1"
    );

  }


  /*
   * Standard watch URL
   */

  try {

    const parsed =
      new URL(
        url
      );


    let id =
      parsed.searchParams.get(
        "v"
      );


    /*
     * Short URL
     */

    if (
      parsed.hostname === "youtu.be"
    ) {

      id =
        parsed.pathname
          .replace("/", "");

    }


    if (id) {

      return (
        "https://www.youtube.com/embed/" +
        id +
        "?autoplay=1&rel=0&modestbranding=1"
      );

    }

  }
  catch (error) {

    console.warn(
      "URL YouTube tidak valid:",
      error
    );

  }


  return "";

}



/* ============================================================
   JOYSTICK
============================================================ */

let joystickVector = {

  x: 0,

  y: 0

};


const joystick =
  nipplejs.create({

    zone:
      document.getElementById(
        "joystick-zone"
      ),

    mode:
      "static",

    position: {

      left: "60px",

      bottom: "60px"

    },

    color:
      COLORS.blue,

    size:
      90

  });


joystick.on(
  "move",
  (
    event,
    data
  ) => {

    if (
      data &&
      data.vector
    ) {

      joystickVector.x =
        data.vector.x;

      joystickVector.y =
        data.vector.y;

    }

  }
);


joystick.on(
  "end",
  () => {

    joystickVector = {

      x: 0,

      y: 0

    };

  }
);



/* ============================================================
   PLAYER MOVEMENT
============================================================ */

const SPEED =
  0.055;


function movementLoop() {

  /*
   * Do not move camera
   * while watching studio.
   */

  if (
    !studio.getAttribute(
      "visible"
    )
  ) {

    if (
      joystickVector.x !== 0 ||
      joystickVector.y !== 0
    ) {

      const rotation =
        camera.getAttribute(
          "rotation"
        );


      const angle =
        THREE.MathUtils.degToRad(
          rotation.y
        );


      const forward =
        joystickVector.y *
        SPEED;


      const strafe =
        joystickVector.x *
        SPEED;


      const dx =
        strafe *
        Math.cos(angle)
        -
        forward *
        Math.sin(angle);


      const dz =
        -strafe *
        Math.sin(angle)
        -
        forward *
        Math.cos(angle);


      const current =
        rig.getAttribute(
          "position"
        );


      rig.setAttribute(
        "position",
        {

          x:
            current.x + dx,

          y:
            1.6,

          z:
            current.z + dz

        }
      );

    }

  }


  /*
   * Boundary
   */

  const pos =
    rig.getAttribute(
      "position"
    );


  pos.x =
    Math.max(
      -3.8,
      Math.min(
        3.8,
        pos.x
      )
    );


  /*
   * Gallery boundary
   */

  if (
    gallery.getAttribute(
      "visible"
    )
  ) {

    pos.z =
      Math.max(
        -42,
        Math.min(
          5,
          pos.z
        )
      );

  }


  rig.setAttribute(
    "position",
    pos
  );


  requestAnimationFrame(
    movementLoop
  );

}

       GLOBAL
    ====================================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #f4f1e9;

      font-family:

      font-family: inherit;
    }


    /* =====================================================
       LOADING
    ====================================================== */

    #loading {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      background:
        linear-gradient(
          145deg,
          #fbfaf6,
          #eef3f0
        );

      color: #183c54;

    #loading-logo-bps { width:150px; max-width:38vw; max-height:82px; object-fit:contain; }
    #loading-logo-kopi { width:175px; max-width:42vw; max-height:92px; object-fit:contain; }


    #loading-title {

      font-size: 27px;

      font-weight: 900;

      letter-spacing: 4px;

      color: #633b25;

    }


    #loading-subtitle {

      margin-top: 8px;

      font-size: 12px;

      color: #75808a;

      letter-spacing: 1px;

    }


    #loading-status {

      margin-top: 18px;

      padding: 7px 14px;

      border-radius: 20px;

      background:
        rgba(
          7,
          148,
          210,
          0.08
        );

      color: #0794d2;

      font-size: 10px;

      font-weight: 800;

    }


    /* =====================================================
       HUD
    ====================================================== */

    #hud {

      position: fixed;

      top: 18px;

      left: 50%;

      transform:
        translateX(-50%);

      z-index: 5000;

      max-width: 90vw;

      padding: 9px 18px;

      border-radius: 30px;

      background:
        rgba(
          255,
          255,
          255,
          0.92
        );

      border:
        1px solid
        rgba(
          7,
          148,
          210,
          0.20
        );

      color: #174e6d;

      font-size: 11px;

      font-weight: 800;

      text-align: center;

      pointer-events: none;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.08);

    }


    /* =====================================================
       BACK YEAR
    ====================================================== */

    #back-year {

      position: fixed;

      left: 18px;
      top: 18px;

      z-index: 5500;

      display: none;

      padding: 10px 15px;

      border: none;

      border-radius: 12px;

      color: white;

      background:
        #0794d2;

      font-size: 11px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.10);

    }


    #back-year:hover {
      background: #067eae;
    }


    /* =====================================================
       CLOSE STUDIO
    ====================================================== */

    #close-studio {

      position: fixed;

      right: 18px;
      top: 18px;

      z-index: 7500;

      display: none;

      padding: 10px 15px;

      border: none;

      border-radius: 12px;

      color: #ffffff;

      background:

      font-size: 11px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:

    #close-studio:hover {
      background: #d8740a;
    }


    /* =====================================================
       JOYSTICK
    ====================================================== */

    #joystick-zone {

      position: fixed;

      left: 18px;
      bottom: 18px;

      width: 125px;
      height: 125px;

      z-index: 5000;

      pointer-events: auto;

      touch-action: none;

       MOBILE
    ====================================================== */

         WORLD
    ==================================================== -->

    ></a-entity>


    <a-entity

    ></a-entity>


    <a-entity
      id="studio"

    <!-- ===================================================
         PLAYER
    ==================================================== -->

    <a-entity
      id="player"
      position="0 1.6 6"
    >

      <a-camera

        id="camera"

        look-controls="
          pointerLockEnabled: false;
          magicWindowTrackingEnabled: true;
          touchEnabled: true;
          mouseEnabled: true;
        "

        wasd-controls="
          acceleration: 14;
          fly: false;
        "
      >

        <a-cursor

          id="cursor"

          cursor="
            fuse: false;
            rayOrigin: mouse;
          "

          raycaster="
            objects: .clickable;
            far: 40;
          "

          material="
            shader: flat;
            color: #f28c18;
          "

          scale="
            0.60
            0.60
            0.60
          "

function createText(
  value,
  position,
  color,
  width,
  align = "center"
) {

  const text =
    document.createElement(
      "a-text"
    );


  text.setAttribute(
    "value",
    value
  );


  text.setAttribute(
    "position",
    position
  );


  text.setAttribute(
    "color",
    color
  );


  text.setAttribute(
    "width",
    width
  );


  text.setAttribute(
    "align",
    align
  );


  return text;

}


/* ============================================================
   BOX
============================================================ */

function createBox(
  position,
  width,
  height,
  depth,
  color,
  material = ""
) {

  const box =
    document.createElement(
      "a-box"
    );


  box.setAttribute(
    "position",
    position
  );


  box.setAttribute(
    "width",
    width
  );


  box.setAttribute(
    "height",
    height
  );


  box.setAttribute(
    "depth",
    depth
  );


  box.setAttribute(
    "color",
    color
  );


  if (material) {

    box.setAttribute(
      "material",
      material
    );

  }


  return box;

}

/* ============================================================
   OPEN STUDIO
============================================================ */

function openStudio(

  item,

  posterGroup

) {

  if (
    studioOpening
  ) {

    return;

  }


  if (
    !item ||
    !posterGroup
  ) {

    return;

  }


  studioOpening =
    true;


  currentStudio =
    item;


  currentPosterGroup =
    posterGroup;


  /* ========================================================
     HIDE POSTER
  ======================================================== */

  const poster =
    posterGroup.querySelector(
      "a-image"
    );


  if (
    poster
  ) {

    poster.setAttribute(
      "visible",
      "false"
    );

  }


  /* ========================================================
     MASUK STUDIO — tanpa pintu animasi
  ======================================================== */

  /* ========================================================
     AFTER DOOR
  ======================================================== */

  setTimeout(

    function() {

      buildStudio(
        item
      );


      gallery.setAttribute(
        "visible",
        "false"
      );


      yearHall.setAttribute(
        "visible",
        "false"
      );


      studio.setAttribute(
        "visible",
        "true"
      );


      backYear.style.display =
        "none";


      closeStudioButton.style.display =
        "block";


      /* ====================================================
         CAMERA
      ==================================================== */

      player.setAttribute(
        "position",
        "0 1.6 2.4"
      );


      camera.setAttribute(
        "rotation",
        "0 0 0"
      );



      camera.setAttribute(
        "look-controls",
        "enabled: false; magicWindowTrackingEnabled: false; touchEnabled: false; mouseEnabled: false;"
      );

      /* ====================================================
         YOUTUBE
      ==================================================== */


      const embedURL =
        normalizeYoutubeUrl(
          item.youtube
        );


      if (embedURL) {
        youtubeFrame.src = embedURL;
        youtubeLayer.style.display = "flex";
      }

      setupStudioDocuments(item);
      studioDocs.style.display = "block";
      if (("ontouchstart" in window) || navigator.maxTouchPoints > 0) gyroButton.style.display = "none";


      studioOpening =
        false;

    },

    120

  );

}

/* ============================================================
   ANIMATE DOOR
============================================================ */

function animateStudioDoor(
  group
) {

  if (
    !group
  ) {

    return;

  }


  const left =
    group._studioLeftDoor;


  const right =
    group._studioRightDoor;


  if (
    !left ||
    !right
  ) {

    return;

  }


  /* ========================================================
     LEFT
  ======================================================== */

  left.setAttribute(

    "animation__open",

    `
      property: rotation;
      from: 0 0 0;
      to: 0 85 0;
      dur: 850;
      easing: easeInOutCubic;
    `

  );


  /* ========================================================
     RIGHT
  ======================================================== */

  right.setAttribute(

    "animation__open",

    `
      property: rotation;
      from: 0 0 0;
      to: 0 -85 0;
      dur: 850;
      easing: easeInOutCubic;
    `

  );

}

/* ============================================================
   YOUTUBE NORMALIZER
============================================================ */

function normalizeYoutubeUrl(
  url
) {

  if (
    !url ||
    url === "#"
  ) {

    return "";

  }


  /*
   * Placeholder
   */

  if (
    url.includes(
      "VIDEO_ID_"
    )
  ) {

    return "";

  }


  try {

    const parsed =
      new URL(
        url
      );


    let videoId =
      "";


    /* ======================================================
       WATCH
    ====================================================== */

    if (

      parsed.hostname.includes(
        "youtube.com"
      )

      &&

      parsed.pathname ===
        "/watch"

    ) {

      videoId =
        parsed.searchParams.get(
          "v"
        ) || "";

    }


    /* ======================================================
       LIVE
    ====================================================== */

    else if (

      parsed.hostname.includes(
        "youtube.com"
      )

      &&

      parsed.pathname.startsWith(
        "/live/"
      )

    ) {

      const parts =
        parsed.pathname.split(
          "/"
        );


      videoId =
        parts[2] || "";

    }


    /* ======================================================
       EMBED
    ====================================================== */

    else if (

      parsed.hostname.includes(
        "youtube.com"
      )

      &&

      parsed.pathname.startsWith(
        "/embed/"
      )

    ) {

      const parts =
        parsed.pathname.split(
          "/"
        );


      videoId =
        parts[2] || "";

    }


    /* ======================================================
       YOUTU.BE
    ====================================================== */

    else if (

      parsed.hostname ===
        "youtu.be"

    ) {

      videoId =

        parsed.pathname

          .replace(
            /^\/+/,
            ""
          )

          .split(
            "/"
          )[0];

    }


    if (
      videoId
    ) {

      return (

        "https://www.youtube.com/embed/" +

        videoId +

        "?autoplay=1" +

        "&rel=0" +

        "&modestbranding=1"

      );

    }

  }
  catch (
    error
  ) {

    console.error(

      "YouTube URL error:",

      url,

      error

    );

  }


  return "";

}


/* ============================================================
   JOYSTICK
============================================================ */

let joystickVector = {

  x: 0,

  y: 0

};


const joystick =
  nipplejs.create({

    zone:
      document.getElementById(
        "joystick-zone"
      ),

    mode:
      "static",

    position: {

      left:
        "60px",

      bottom:
        "60px"

    },

    color:
      COLORS.blue,

    size:
      90

  });


joystick.on(

  "move",

  function(
    event,
    data
  ) {

    if (
      data &&
      data.vector
    ) {

      joystickVector.x =
        data.vector.x;


      joystickVector.y =
        data.vector.y;

    }

  }

);


joystick.on(

  "end",

  function() {

    joystickVector = {

      x: 0,

      y: 0

    };

  }

);


/* ============================================================
   MOVEMENT
============================================================ */

const MOVEMENT_SPEED =
  0.055;


function movementLoop() {

  /*
   * Movement disabled inside studio.
   */

  if (
    !studio.getAttribute(
      "visible"
    )
  ) {

    if (

      joystickVector.x !== 0 ||

      joystickVector.y !== 0

    ) {

      const rotation =
        camera.getAttribute(
          "rotation"
        );


      const angle =
        THREE.MathUtils.degToRad(
          rotation.y
        );


      const forward =
        joystickVector.y *
        MOVEMENT_SPEED;


      const strafe =
        joystickVector.x *
        MOVEMENT_SPEED;


      const dx =

        (
          strafe *
          Math.cos(
            angle
          )
        )

        -

        (
          forward *
          Math.sin(
            angle
          )
        );


      const dz =

        (
          -strafe *
          Math.sin(
            angle
          )
        )

        -

        (
          forward *
          Math.cos(
            angle
          )
        );


      const current =
        player.getAttribute(
          "position"
        );


      player.setAttribute(

        "position",

        {

          x:
            current.x + dx,

          y:
            1.6,

          z:
            current.z + dz

        }

      );

    }

  }


  /* ========================================================
     LIMIT X
  ======================================================== */

  const pos =
    player.getAttribute(
      "position"
    );


  pos.x =
    Math.max(

      -3.8,

      Math.min(
        3.8,
        pos.x
      )

    );


  /* ========================================================
     YEAR HALL Z
  ======================================================== */

  if (

    yearHall.getAttribute(
      "visible"
    )

  ) {

    pos.z =
      Math.max(

        -4,

        Math.min(
          6,
          pos.z
        )

      );

  }


  /* ========================================================
     GALLERY Z
  ======================================================== */

  if (

    gallery.getAttribute(
      "visible"
    )

  ) {

    pos.z =
      Math.max(

        -42,

        Math.min(
          5,
          pos.z
        )

      );

  }


  player.setAttribute(
    "position",
    pos
  );


  requestAnimationFrame(
    movementLoop
  );

}

       GLOBAL

      padding: 0;

    ====================================================== */

      z-index: 99999;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      background:
        linear-gradient(
          145deg,
          #fbfaf6,
          #eef3f0

    #loading-logo-kopi { width:175px; max-width:42vw; max-height:92px; object-fit:contain; }


    #loading-title {

      font-size: 27px;

      font-weight: 900;

      letter-spacing: 4px;

      color: #633b25;

    }


    #loading-subtitle {

      margin-top: 8px;

      font-size: 12px;

      color: #75808a;

      letter-spacing: 1px;

    }


    #loading-status {

      margin-top: 18px;

      padding: 7px 14px;

      border-radius: 20px;

      background:
        rgba(
          7,
          148,
          210,
          0.08
        );

      color: #0794d2;

      font-size: 10px;

      font-weight: 800;

    }


    /* =====================================================
       HUD
    ====================================================== */

    #hud {

      position: fixed;

      top: 18px;

      left: 50%;

      transform:

      z-index: 5000;

      max-width: 90vw;

      padding: 9px 18px;

      background:

          255,
          255,
          255,

      border:

          7,
          148,
          210,

        );

      color: #174e6d;

      font-size: 11px;

      font-weight: 800;

      text-align: center;

      pointer-events: none;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.08);

    }


    /* =====================================================
       BACK YEAR
    ====================================================== */

    #back-year {

      position: fixed;

      left: 18px;
      top: 18px;

      z-index: 5500;

      display: none;

      padding: 10px 15px;

      border: none;

      border-radius: 12px;

      color: white;

      background:
        #0794d2;

      font-size: 11px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.10);

    }


    #back-year:hover {
      background: #067eae;
    }


    /* =====================================================
       CLOSE STUDIO
    ====================================================== */

    #close-studio {

      position: fixed;

      right: 18px;
      top: 18px;

      z-index: 7500;

      display: none;

      padding: 10px 15px;

      border: none;

      border-radius: 12px;

      color: #ffffff;

      background:
        #f28c18;

      font-size: 11px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.15);

    }


    #close-studio:hover {
      background: #d8740a;
    }


    /* =====================================================
       DUAL JOYSTICK CONTROLS
    ====================================================== */
    .joystick-zone {
      position: fixed;
      bottom: 18px;
      width: 125px;
      height: 125px;
      z-index: 5000;
      pointer-events: auto;
      touch-action: none;
    }
    #joystick-zone { left: 18px; }
    #look-joystick-zone { right: 18px; }
    .joystick-caption {
      position: fixed;
      bottom: 8px;
      z-index: 5001;
      color: rgba(255,255,255,.72);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 1.2px;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,.55);
    }
    #move-caption { left: 48px; }
    #look-caption { right: 48px; }

    /* =====================================================
       YOUTUBE CINEMA FRAME
       Video HTML berada tepat di depan area layar studio.
    ====================================================== */
    #youtube-layer {
      position:fixed;
      inset:0;
      z-index:5000;
      display:none;
      align-items:center;
      justify-content:center;
      pointer-events:none;
    }
    #youtube-frame-container {
      position:relative;
      width:min(62vw, 880px);
      aspect-ratio:16/9;
      pointer-events:auto;
      background:#05080b;
      border:7px solid #111820;
      border-radius:6px;
      overflow:visible;
      box-shadow:
        0 0 0 3px #f28c18,
        0 0 0 7px rgba(242,140,24,.13),
        0 28px 75px rgba(0,0,0,.68),
        0 0 70px rgba(242,140,24,.18);
    }
    #youtube-frame-container::before {
      content:"";
      position:absolute;
      inset:-13px -13px;
      border:1px solid rgba(242,140,24,.28);
      border-radius:10px;
      pointer-events:none;
    }
    #youtube-frame-container::after {
      content:"";
      position:absolute;
      left:50%;
      bottom:-16px;
      width:30%;
      height:5px;
      transform:translateX(-50%);
      background:#f28c18;
      border-radius:999px;
      box-shadow:0 0 18px rgba(242,140,24,.7);
      pointer-events:none;
    }
    #youtube-frame {
      width:100%;
      height:100%;
      border:0;
      display:block;
      border-radius:0;
      background:#000;
    }
    #youtube-title {
      position:absolute;
      left:50%;
      top:-47px;
      transform:translateX(-50%);
      color:#fff;
      font-size:13px;
      font-weight:900;
      letter-spacing:2px;
      white-space:nowrap;
      text-shadow:0 2px 12px rgba(0,0,0,.85);
    }
    #on-air-label {
      position:absolute;
      top:11px;
      right:11px;
      z-index:20;
      padding:5px 9px;
      border-radius:5px;
      background:#df2929;
      color:#fff;
      font-size:9px;
      font-weight:900;
      letter-spacing:1px;
      box-shadow:0 4px 12px rgba(0,0,0,.35);
    }

    /* =====================================================
       DOCUMENTS
    ====================================================== */
    #studio-docs {
      position:fixed;
      right:18px;
      bottom:155px;
      z-index:6500;
      display:none;
      width:220px;
      padding:13px;
      border-radius:16px;
      background:rgba(13,21,28,.92);
      border:1px solid rgba(242,140,24,.50);
      box-shadow:0 14px 35px rgba(0,0,0,.30);
      backdrop-filter:blur(10px);
    }
    #studio-docs-title {
      color:#fff;
      font-size:10px;
      font-weight:900;
      letter-spacing:1.4px;
      margin-bottom:8px;
    }
    .studio-doc-button {
      display:block;
      width:100%;
      margin-top:7px;
      padding:9px 10px;
      border:0;
      border-radius:8px;
      color:#fff;
      font-size:10px;
      font-weight:900;
      text-align:left;
      cursor:pointer;
      transition:transform .18s ease, filter .18s ease;
    }
    .studio-doc-button:hover { transform:translateX(-2px); filter:brightness(1.08); }
    .studio-doc-button.blue { background:#0794d2; }
    .studio-doc-button.green { background:#65b82e; }
    .studio-doc-button.orange { background:#f28c18; }

       MOBILE
    ====================================================== */

  <!-- =====================================================
       A-FRAME
  ====================================================== -->

  <a-scene
    id="scene"

    embedded

    vr-mode-ui="
      enabled: false
    "

    renderer="
      antialias: true;
      colorManagement: true;
    "
  >


    <!-- ===================================================
         ASSETS
         
         Logo + poster dipanggil langsung dari path.
    ==================================================== -->

    <a-assets
      timeout="30000"
    >

      <img
        id="logo-bps"
        src="./logo-bps.png"
      >

      <img
        id="logo-kopi"
        src="./logo-kopi-pahit.png"
      >

    </a-assets>


    <!-- ===================================================
         LIGHTING
    ==================================================== -->

    <a-entity
      light="
        type: ambient;
        intensity: 0.95;
        color: #ffffff;
      "
    ></a-entity>


    <a-entity
      light="
        type: directional;
        intensity: 0.75;
        color: #ffffff;
      "
      position="0 8 5"
    ></a-entity>


    <a-entity
      light="
        type: point;
        intensity: 1.1;
        distance: 22;
        color: #0794d2;
      "
      position="-5 4 -7"
    ></a-entity>


    <a-entity
      light="
        type: point;
        intensity: 1.1;
        distance: 22;
        color: #f28c18;
      "
      position="5 4 -7"
    ></a-entity>


    <a-entity
      light="
        type: point;
        intensity: 0.65;
        distance: 18;
        color: #65b82e;
      "
      position="0 4 -18"
    ></a-entity>


    <!-- ===================================================
         SKY
    ==================================================== -->

    <a-sky
      color="#f4f1e9"
    ></a-sky>


    <!-- ===================================================
         WORLD
    ==================================================== -->

    <a-entity
      id="year-hall"
    ></a-entity>


    <a-entity
      id="gallery"
      visible="false"
    ></a-entity>


    <a-entity
      id="studio"
      visible="false"
    ></a-entity>


    <!-- ===================================================
         PLAYER
    ==================================================== -->

    <a-entity
      id="player"
      position="0 1.6 6"
    >

      <a-camera

        id="camera"

        look-controls="
          pointerLockEnabled: false;
          magicWindowTrackingEnabled: true;
          touchEnabled: true;
          mouseEnabled: true;
        "

        wasd-controls="
          acceleration: 14;
          fly: false;
        "
      >

        <a-cursor

          id="cursor"

          cursor="
            fuse: false;
            rayOrigin: mouse;
          "

          raycaster="
            objects: .clickable;
            far: 40;
          "

          material="
            shader: flat;
            color: #f28c18;
          "

          scale="
            0.60
            0.60
            0.60
          "

        ></a-cursor>

      </a-camera>

    </a-entity>


  </a-scene>

function createText(
  value,
  position,
  color,
  width,
  align = "center"
) {

  const text =
    document.createElement(
      "a-text"
    );


  text.setAttribute(
    "value",
    value
  );


  text.setAttribute(
    "position",
    position
  );


  text.setAttribute(
    "color",
    color
  );


  text.setAttribute(
    "width",
    width
  );


  text.setAttribute(
    "align",
    align
  );


  return text;

}


/* ============================================================
   BOX
============================================================ */

function createBox(
  position,
  width,
  height,
  depth,
  color,
  material = ""
) {

  const box =
    document.createElement(
      "a-box"
    );


  box.setAttribute(
    "position",
    position
  );


  box.setAttribute(
    "width",
    width
  );


  box.setAttribute(
    "height",
    height
  );


  box.setAttribute(
    "depth",
    depth
  );


  box.setAttribute(
    "color",
    color
  );


  if (material) {

    box.setAttribute(
      "material",
      material
    );

  }


  return box;

}

/* ============================================================
   OPEN STUDIO
============================================================ */

function openStudio(
  item,
  posterGroup
) {
  if (studioOpening || !item || !posterGroup) return;
  studioOpening=true; currentStudio=item; currentPosterGroup=posterGroup;
  const poster=posterGroup.querySelector("a-image");
  if (poster) poster.setAttribute("visible","false");

  // Restore the portal-opening transition from the poster.
  createStudioDoor(posterGroup);
  animateStudioDoor(posterGroup);

  setTimeout(function(){
    buildStudio(item);
    gallery.setAttribute("visible","false");
    yearHall.setAttribute("visible","false");
    studio.setAttribute("visible","true");
    backYear.style.display="none";
    closeStudioButton.style.display="block";
    player.setAttribute("position","0 1.6 2.4");
    camera.setAttribute("rotation","0 0 0");
    camera.setAttribute("look-controls","enabled: false; magicWindowTrackingEnabled: false; touchEnabled: false; mouseEnabled: false; pointerLockEnabled: false;");
    const embedURL=normalizeYoutubeUrl(item.youtube);
    if(embedURL){
      youtubeTitle.innerText=`STUDIO ${String(item.edisi).padStart(2,"0")} · KOPI PAHIT #${item.edisi}`;
      youtubeFrame.src=embedURL; youtubeLayer.style.display="flex";
    }
    setupStudioDocuments(item); studioDocs.style.display="block"; studioOpening=false;
  },900);
}

function createStudioDoor(group){
  group.querySelectorAll(".temporary-studio-door").forEach(el=>el.remove());
  const opening=createBox("0 0 0.25",1.58,2.25,0.08,"#070b10"); opening.classList.add("temporary-studio-door"); group.appendChild(opening);
  const header=createBox("0 1.17 0.31",1.82,0.08,0.10,COLORS.orange,`emissive: ${COLORS.orange}; emissiveIntensity: 0.65;`); header.classList.add("temporary-studio-door"); group.appendChild(header);
  const leftPivot=document.createElement("a-entity"); leftPivot.setAttribute("position","-0.79 0 0.31"); leftPivot.classList.add("temporary-studio-door");
  leftPivot.appendChild(createBox("0.395 0 0",0.79,2.22,0.10,COLORS.orange,`emissive: ${COLORS.orange}; emissiveIntensity: 0.18;`));
  const rightPivot=document.createElement("a-entity"); rightPivot.setAttribute("position","0.79 0 0.31"); rightPivot.classList.add("temporary-studio-door");
  rightPivot.appendChild(createBox("-0.395 0 0",0.79,2.22,0.10,COLORS.orange,`emissive: ${COLORS.orange}; emissiveIntensity: 0.18;`));
  const label=createText("STUDIO", "0 0.08 0.40", "#ffffff", 1.55); label.classList.add("temporary-studio-door");
  group.appendChild(leftPivot); group.appendChild(rightPivot); group.appendChild(label); group._studioLeftDoor=leftPivot; group._studioRightDoor=rightPivot;
}
function animateStudioDoor(group){
  const left=group&&group._studioLeftDoor, right=group&&group._studioRightDoor; if(!left||!right) return;
  left.setAttribute("animation__open","property: rotation; from: 0 0 0; to: 0 86 0; dur: 760; easing: easeInOutCubic;");
  right.setAttribute("animation__open","property: rotation; from: 0 0 0; to: 0 -86 0; dur: 760; easing: easeInOutCubic;");
}

/* ============================================================
   YOUTUBE NORMALIZER
============================================================ */

function normalizeYoutubeUrl(
  url
) {

  if (
    !url ||
    url === "#"
  ) {

    return "";

  }


  /*
   * Placeholder
   */

  if (
    url.includes(
      "VIDEO_ID_"
    )
  ) {

    return "";

  }


  try {

    const parsed =
      new URL(
        url
      );


    let videoId =
      "";


    /* ======================================================
       WATCH
    ====================================================== */

    if (

      parsed.hostname.includes(
        "youtube.com"
      )

      &&

      parsed.pathname ===
        "/watch"

    ) {

      videoId =
        parsed.searchParams.get(
          "v"
        ) || "";

    }


    /* ======================================================
       LIVE
    ====================================================== */

    else if (

      parsed.hostname.includes(
        "youtube.com"
      )

      &&

      parsed.pathname.startsWith(
        "/live/"
      )

    ) {

      const parts =
        parsed.pathname.split(
          "/"
        );


      videoId =
        parts[2] || "";

    }


    /* ======================================================
       EMBED
    ====================================================== */

    else if (

      parsed.hostname.includes(
        "youtube.com"
      )

      &&

      parsed.pathname.startsWith(
        "/embed/"
      )

    ) {

      const parts =
        parsed.pathname.split(
          "/"
        );


      videoId =
        parts[2] || "";

    }


    /* ======================================================
       YOUTU.BE
    ====================================================== */

    else if (

      parsed.hostname ===
        "youtu.be"

    ) {

      videoId =

        parsed.pathname

          .replace(
            /^\/+/,
            ""
          )

          .split(
            "/"
          )[0];

    }


    if (
      videoId
    ) {

      return (

        "https://www.youtube.com/embed/" +

        videoId +

        "?autoplay=1" +

        "&rel=0" +

        "&modestbranding=1"

      );

    }

  }
  catch (
    error
  ) {

    console.error(

      "YouTube URL error:",

      url,

      error

    );

  }


  return "";

}


/* ============================================================
   DUAL JOYSTICK
   Kiri = bergerak, kanan = melihat/menoleh.
============================================================ */
const isTouchDevice = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
let joystickVector = { x:0, y:0 };
let lookVector = { x:0, y:0 };

const joystick = nipplejs.create({
  zone: document.getElementById("joystick-zone"),
  mode: "static",
  position: { left:"50%", top:"50%" },
  color: COLORS.blue,
  size: 88,
  restOpacity: 0.7
});

const lookJoystick = nipplejs.create({
  zone: document.getElementById("look-joystick-zone"),
  mode: "static",
  position: { left:"50%", top:"50%" },
  color: COLORS.orange,
  size: 88,
  restOpacity: 0.7
});

joystick.on("move", function(event,data){
  if(data && data.vector){ joystickVector.x=data.vector.x; joystickVector.y=data.vector.y; }
});
joystick.on("end", function(){ joystickVector={x:0,y:0}; });

lookJoystick.on("move", function(event,data){
  if(data && data.vector){ lookVector.x=data.vector.x; lookVector.y=data.vector.y; }
});
lookJoystick.on("end", function(){ lookVector={x:0,y:0}; });

function lookLoop(){
  if(isTouchDevice && (lookVector.x!==0 || lookVector.y!==0)){
    const rot=camera.getAttribute("rotation");
    const sensitivity = studio.getAttribute("visible") ? 2.0 : 2.35;
    rot.y -= lookVector.x * sensitivity;
    rot.x -= lookVector.y * sensitivity;
    rot.x=Math.max(-70, Math.min(70, rot.x));
    camera.setAttribute("rotation", rot);
  }
  requestAnimationFrame(lookLoop);
}
lookLoop();

/* ============================================================
   MOVEMENT
============================================================ */

const MOVEMENT_SPEED =
  0.055;


function movementLoop() {

  /*
   * Movement disabled inside studio.
   */

  if (
    !studio.getAttribute(
      "visible"
    )
  ) {

    if (

      joystickVector.x !== 0 ||

      joystickVector.y !== 0

    ) {

      const rotation =
        camera.getAttribute(
          "rotation"
        );


      const angle =
        THREE.MathUtils.degToRad(
          rotation.y
        );


      const forward =
        joystickVector.y *
        MOVEMENT_SPEED;


      const strafe =
        joystickVector.x *
        MOVEMENT_SPEED;


      const dx =

        (
          strafe *
          Math.cos(
            angle
          )
        )

        -

        (
          forward *
          Math.sin(
            angle
          )
        );


      const dz =

        (
          -strafe *
          Math.sin(
            angle
          )
        )

        -

        (
          forward *
          Math.cos(
            angle
          )
        );


      const current =
        player.getAttribute(
          "position"
        );


      player.setAttribute(

        "position",

        {

          x:
            current.x + dx,

          y:
            1.6,

          z:
            current.z + dz

        }

      );

    }

  }


  /* ========================================================
     LIMIT X
  ======================================================== */

  const pos =
    player.getAttribute(
      "position"
    );


  pos.x =
    Math.max(

      -3.8,

      Math.min(
        3.8,
        pos.x
      )

    );


  /* ========================================================
     YEAR HALL Z
  ======================================================== */

  if (

    yearHall.getAttribute(
      "visible"
    )

  ) {

    pos.z =
      Math.max(

        -4,

        Math.min(
          6,
          pos.z
        )

      );

  }


  /* ========================================================
     GALLERY Z
  ======================================================== */

  if (

    gallery.getAttribute(
      "visible"
    )

  ) {

    pos.z =
      Math.max(

        -42,

        Math.min(
          5,
          pos.z
        )

      );

  }


  player.setAttribute(
    "position",
    pos
  );


  requestAnimationFrame(
    movementLoop
  );

}
